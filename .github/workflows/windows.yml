name: Windows build and package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build, test and verify portable ZIP
        shell: powershell
        run: .\Release.ps1
      - name: Upload verified artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: DiskGuide-windows
          if-no-files-found: error
          path: |
            dist/DiskGuide-*-windows.zip
            dist/SHA256SUMS.txt
